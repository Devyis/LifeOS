<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS · Personal</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
:root{--ring:var(--ac);--chip-cr:#c62828;--chip-c1:#b45309;--chip-c2:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip-cr:#ff8a8a;--chip-c1:#ffc15c;--chip-c2:#8bbcff}}
:root[data-theme="dark"]{--chip-cr:#ff8a8a;--chip-c1:#ffc15c;--chip-c2:#8bbcff}
body{padding:max(24px,env(safe-area-inset-top)) 24px max(48px,env(safe-area-inset-bottom))}
main{max-width:1180px;margin:0 auto}

/* encabezado */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}
.top span{display:flex;gap:8px;flex-wrap:wrap}
h1{margin:6px 0 18px;font:700 clamp(30px,8vw,40px)/1.05 var(--f-head);letter-spacing:-.025em}
h3{margin:28px 4px 12px;font:600 16px var(--f-head);color:var(--mut)}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:16px 20px}
.card.empty{border-style:dashed;box-shadow:none}
.empty{color:var(--mut);padding:24px;text-align:center}

/* captura rápida */
.cap-lbl{font:700 13px var(--f-body);color:var(--ac);margin:0 6px 8px}
.capbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 22px;border-radius:999px;border:2px solid var(--ac);box-shadow:0 0 0 4px var(--card2),0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent),0 10px 28px -6px color-mix(in srgb,var(--ac) 45%,transparent)}
.capbar:focus-within{box-shadow:0 0 0 5px var(--card2),0 0 0 5px color-mix(in srgb,var(--ac) 24%,transparent),0 12px 32px -6px color-mix(in srgb,var(--ac) 60%,transparent)}
.capbar input{font-size:16px;font-weight:600}
.capbar input::placeholder{color:var(--mut);opacity:1;font-weight:500}
.capbar input{flex:1;min-width:0;border:0;border-radius:0;background:transparent;padding:10px 0}
.capbar input:focus-visible{outline:none}

/* tarea */
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:600 18px/1.25 var(--f-head)}
.row .t small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.row.task{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"chk t chip acts";column-gap:14px;align-items:center}
.row.task .chk{grid-area:chk}.row.task .t{grid-area:t}.row.task .chip{grid-area:chip}.row.task .acts{grid-area:acts;display:flex}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;color:transparent;font-size:16px;display:grid;place-items:center;padding:0;transition:background .15s,color .15s,border-color .15s}
.chk:hover{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.x{color:var(--mut);background:none;border:0;cursor:pointer;font-size:18px;width:38px;height:38px;border-radius:50%;padding:0}
.x:hover{background:var(--card2)}
.pl{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin:7px 6px 0 0}
.pm{background:var(--card2);background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ok)}
.pg{background:var(--card2);color:var(--mut)}

/* fecha y hora */
.chip{flex:none;text-align:center;border-radius:20px;padding:9px 14px;min-width:94px}
.chip .a{display:block;font-size:12px;font-weight:700}
.chip .h{display:block;font:700 22px/1.15 var(--f-head)}
.chip .h.s{font:600 12px/1.7 var(--f-body)}
.chip .f{display:block;font-size:11px;opacity:.85}
.cr{background:var(--card2);background:color-mix(in srgb,var(--chip-cr) 15%,transparent);color:var(--chip-cr)}
.c1{background:var(--card2);background:color-mix(in srgb,var(--chip-c1) 16%,transparent);color:var(--chip-c1)}
.c2{background:var(--card2);background:color-mix(in srgb,var(--chip-c2) 15%,transparent);color:var(--chip-c2)}
.c3{background:var(--card2);color:var(--mut)}

/* conflictos de horario */
.ch{padding:20px 24px;background:var(--card);background:color-mix(in srgb,var(--cc) 9%,var(--card));border-color:var(--card2);border-color:color-mix(in srgb,var(--cc) 38%,transparent)}
.ch b{display:block;font:600 17px var(--f-head)}
.ch small{display:block;color:var(--mut);margin-top:4px;line-height:1.45}
.ch .sg{color:var(--tx);margin-top:8px}
.ch .nv{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--cc);padding:3px 11px;border-radius:999px;margin-bottom:8px}

/* áreas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.area{position:relative;overflow:hidden;cursor:pointer;border-radius:28px;padding:18px;transition:transform .2s}
.area:hover{transform:translateY(-3px)}
.area::before{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--c);opacity:.16}
.area .i{position:relative;width:50px;height:50px;border-radius:18px;display:grid;place-items:center;font-size:25px;margin-bottom:14px;background:var(--card2);background:color-mix(in srgb,var(--c) 22%,transparent)}
.area b{position:relative;font:600 16px var(--f-head)}
.area small{position:relative}

/* resumen */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats b{font:700 32px/1.1 var(--f-head);display:block;margin-bottom:2px}

/* ===== tablero ===== */
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin:8px 0 24px}
.hd h1{margin:0}
.hd .sub{color:var(--mut);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:26px 0 10px}
.strip .area{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px}
.strip .area .i{width:42px;height:42px;border-radius:14px;font-size:21px;margin:0;flex:none}
.strip .area>div:last-child{position:relative;min-width:0}
.strip .area b{display:block;font-size:15px;line-height:1.2}
.strip .area small{color:var(--mut);font-size:12px}
.strip .area::before{width:70px;height:70px;right:-20px;top:-20px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
.dash h3{margin:36px 4px 16px}.dash h3:first-child{margin-top:26px}
.side{position:sticky;top:16px;display:grid;gap:22px;margin-top:26px}
.side h3{margin:0 0 16px}
.side .card{padding:22px}
.tgrid,.mini,.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:18px}
.mini{gap:12px}
.tgrid>.empty,.mini>.empty{grid-column:1/-1}
.tk{display:flex;flex-direction:column;gap:16px;padding:18px 18px 18px 22px;border-radius:24px;border-left:5px solid var(--ib,var(--bd))}
.tk-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .chip{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;min-width:0;padding:5px 12px;border-radius:14px;text-align:left}
.tk .chip .a{font-size:12px}.tk .chip .h{font-size:15px}.tk .chip .h.s{font-size:12px;line-height:1.4}.tk .chip .f{font-size:11px}
.tk .acts{display:flex;flex:none}
.tk .x{width:32px;height:32px;font-size:15px}
.tk-b{display:flex;gap:16px;align-items:flex-start}
.tk .chk{flex:none;width:30px;height:30px;font-size:14px}
.tk .t{min-width:0}
.tk .t b{display:block;font:600 16px/1.25 var(--f-head)}
.tk .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:6px}
.tk .pl{margin:10px 8px 0 0}
.mn{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 16px;border-radius:18px}
.mn .chk{flex:none;width:26px;height:26px;font-size:13px}
.mn .t{flex:1;min-width:0}
.mn .t b{display:block;font:600 14px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn .t small{display:block;color:var(--mut);font-size:12px}
.mn .w{flex:none;font-size:12px;color:var(--mut);font-weight:600}
.mn .x{width:30px;height:30px;font-size:14px;flex:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sum b{display:block;font:700 26px/1.1 var(--f-head)}
.sum small,.side .nota{color:var(--mut);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:20px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cal .w{font-size:11px;color:var(--mut);padding-bottom:8px}
.cal button{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:none;color:var(--tx);font:500 13px var(--f-body);cursor:pointer;padding:0}
.cal button:hover{background:var(--card2)}
.cal .dot::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--amb)}
.cal .dr::after{background:var(--red)}
.cal .hoy{background:var(--ac);color:var(--ac-tx);font-weight:700}
.cal .hoy:hover{background:var(--ac)}
.cal .hoy.dot::after{background:var(--ac-tx)}
.pay{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--bd);font-size:14px}
.pay:first-of-type{border-top:0;padding-top:0}
.pay b{font-weight:600}.pay small{display:block;color:var(--mut);font-size:12px}
.pay>span:last-child{font-weight:700;white-space:nowrap}
@media (max-width:900px){
  .dash{grid-template-columns:1fr;gap:8px}
  .side{margin-top:0}
  .side{position:static;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));align-items:start}
}

/* formulario */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .top{margin-bottom:6px}

@media (max-width:520px){
  .two{grid-template-columns:1fr}
}

/* captura múltiple */
.mrow{border:1.5px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;background:var(--card2)}
.mrow.off{opacity:.45}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--mut)}
.mh select{flex:1}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg .full{grid-column:1/-1}
.mrow input,.mrow select{width:100%}
.mh input[type=checkbox]{width:auto}
.mlist{max-height:58vh;overflow:auto;margin-top:10px}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const URL_='https://syeuxondhnartyizvsqb.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5ZXV4b25kaG5hcnR5aXp2c3FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDU5NjksImV4cCI6MjEwNjk4MTk2OX0.S8cXt1awb_AQoQ6Q1ynaqh4D2FVtux2yTxXbpeiJNtg';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'};
const api=async(p,o={})=>{const r=await fetch(URL_+'/rest/v1/'+p,{headers:H,...o});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()};
const DEF=[['Salud','🩺','#ef4444'],['Hogar','🏠','#3b82f6'],['Finanzas','💳','#10b981'],['Trámites','📄','#f59e0b'],['Familia y social','👨‍👩‍👧','#8b5cf6']];
const CATS=['cita','pago','trámite','compromiso','otro'];
let user,areas=[],items=[],cursos=[],view=null;
try{const t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{user=JSON.parse(localStorage.getItem('lifeos_user'))}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const days=f=>{const[y,m,d]=f.split('-').map(Number);const a=new Date(y,m-1,d),n=new Date();n.setHours(0,0,0,0);return Math.round((a-n)/864e5)};
function score(i){const d=days(i.fecha);const u=d<=0?10:d<=2?8:d<=7?5:d<=30?3:1;return u*2+i.importancia*2+i.esfuerzo}
function sort(l){return [...l].sort((a,b)=>{const da=days(a.fecha),db=days(b.fecha);if(da<0||db<0){if(da<0&&db<0)return da-db;return da<0?-1:1}return score(b)-score(a)||da-db})}
function why(i){const d=days(i.fecha);const h=i.hora?' a las '+String(i.hora).slice(0,5):(d<=1&&d>=0?' · todo el día':'');const w=d<0?'Vencido hace '+(-d)+(d==-1?' día':' días'):d==0?'Vence hoy'+h:d==1?'Vence mañana'+h:'En '+d+' días'+h;return w+' · importancia '+['','baja','media','alta'][i.importancia]}
function next(f,r){const[y,m,d]=f.split('-').map(Number);if(r==='semanal')return iso(new Date(y,m-1,d+7));const ty=r==='anual'?y+1:y,tm=r==='anual'?m-1:m;const last=new Date(ty,tm+1,0).getDate();return iso(new Date(ty,tm,Math.min(d,last)))}
let choques=[];
const NV={alto:['#dc2626','Conflicto de horario'],medio:['#b45309','Día cargado'],bajo:['#2563eb','Ojo con este día']};
function choquesHtml(){
  if(!choques.length)return '';
  return '<h3>⚠ Conflictos de horario</h3><div class="chgrid">'+choques.slice(0,5).map(c=>{
    const n=[...(NV[c.nivel]||NV.bajo)];if(c.nivel==='medio'&&c.motivos.some(m=>/hora/.test(m)))n[1]='Conflicto de horario';
    return `<div class="card ch" style="--cc:${n[0]}"><span class="nv">${n[1]}</span><b>${fdate(c.fecha)}</b>`+
      c.motivos.map(m=>`<small>${esc(m)}</small>`).join('')+
      `<small>${c.items.map(i=>(i.origen==='estudio'?'📚 ':'🏡 ')+esc(i.titulo)+(i.monto?' (S/ '+Number(i.monto).toFixed(2)+')':'')).join(' · ')}</small>`+
      `<small class="sg">💡 ${esc(c.sugerencia)}</small></div>`}).join('')+'</div>';
}
async function refreshChoques(){
  try{
    const r=await fetch(URL_+'/rest/v1/rpc/lifeos_choques',{method:'POST',headers:H,body:JSON.stringify({p_username:user.username,p_dias:14})});
    choques=r.ok?await r.json():[];
  }catch(e){choques=[]}
  const el=$('#choques');if(el)el.innerHTML=choquesHtml();
}
async function load(){
  const u=encodeURIComponent(user.username);
  areas=await api('personal_areas?username=eq.'+u+'&order=orden');
  if(!areas.length){areas=await api('personal_areas',{method:'POST',body:JSON.stringify(DEF.map((a,i)=>({username:user.username,nombre:a[0],icono:a[1],color:a[2],orden:i})))})}
  items=await api('personal_items?username=eq.'+u+'&order=fecha');
  try{cursos=await api('courses?username=eq.'+u+'&select=id,name,icon&order=orden')}catch(e){cursos=[]}
}
const DN=['dom','lun','mar','mié','jue','vie','sáb'],MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fdate(f){const[y,m,d]=f.split('-').map(Number);const t=new Date(y,m-1,d);return DN[t.getDay()]+' '+d+' '+MN[m-1]}
function chip(i){const d=days(i.fecha),h=i.hora?String(i.hora).slice(0,5):'';const cl=d<0?'cr':d<=1?'c1':d<=7?'c2':'c3';let a,b,bs=false,f;
  if(d<0){a='Vencido';b='hace '+(-d)+(d==-1?' día':' días');bs=true;f=h?'a las '+h:'todo el día'}
  else{a=d==0?'Hoy':d==1?'Mañana':'En '+d+' días';if(h)b=h;else{b='Todo el día';bs=true}f=fdate(i.fecha)}
  return `<div class="chip ${cl}"><span class="a">${a}</span><span class="h${bs?' s':''}">${b}</span><span class="f">${f}</span></div>`}
function row(i){const a=areas.find(x=>x.id===i.area_id)||{};
  const pills=(i.monto?`<span class="pl pm">S/ ${Number(i.monto).toFixed(2)}</span>`:'')+(i.repite!=='no'?`<span class="pl pg">↻ ${i.repite}</span>`:'');
  const ib=['','var(--bd)','var(--amb)','var(--red)'][i.importancia]||'var(--bd)';
  return `<div class="card tk" style="--ib:${ib}"><div class="tk-h">${chip(i)}<span class="acts"><button class="x" title="Editar" onclick="edit(${i.id})">✏️</button><button class="x" title="Eliminar" onclick="del(${i.id})">🗑</button></span></div><div class="tk-b"><button class="chk" title="Marcar como hecha" onclick="done(${i.id})">✓</button><div class="t"><b>${esc(i.titulo)}</b><small>${a.icono||''} ${esc(a.nombre||'')} · ${i.categoria} · importancia ${['','baja','media','alta'][i.importancia]}</small>${pills?'<div>'+pills+'</div>':''}</div></div></div>`}
function mini(i){const a=areas.find(x=>x.id===i.area_id)||{};
  return `<div class="card mn"><button class="chk" title="Marcar como hecha" onclick="done(${i.id})">✓</button><div class="t"><b>${esc(i.titulo)}</b><small>${a.icono||''} ${esc(a.nombre||'')}${i.monto?' · S/ '+Number(i.monto).toFixed(2):''}</small></div><span class="w">${fdate(i.fecha)}</span><button class="x" title="Editar" onclick="edit(${i.id})">✏️</button></div>`}
function calHtml(pend){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),ym=iso(n).slice(0,7),first=(new Date(y,m,1).getDay()+6)%7,len=new Date(y,m+1,0).getDate(),by={};
  pend.forEach(i=>{if(i.fecha.startsWith(ym)){const d=+i.fecha.slice(8);(by[d]=by[d]||[]).push(i)}});
  let h='<div class="cal">'+['L','M','M','J','V','S','D'].map(d=>`<span class="w">${d}</span>`).join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=len;d++){const l=by[d]||[],c=(l.length?(d<n.getDate()?'dot dr':'dot'):'')+(d===n.getDate()?' hoy':'');
    h+=`<button class="${c.trim()}" title="${l.length?esc(l.map(i=>i.titulo).join(', ')):'Agregar actividad este día'}" onclick="openForm(null,{fecha:'${ym}-${pad(d)}'})">${d}</button>`}
  return h+'</div>'}
function render(){
  if(!user||!user.username){location.replace('./');return}
  const pend=items.filter(i=>!i.hecho),now=new Date(),ym=iso(now).slice(0,7);
  const mesDe=l=>({por:l.filter(i=>!i.hecho&&i.monto&&i.fecha.startsWith(ym)).reduce((t,i)=>t+Number(i.monto),0),ok:l.filter(i=>i.hecho&&i.hecho_en&&i.hecho_en.startsWith(ym)).length});
  if(view){const a=areas.find(x=>x.id===view),l=sort(pend.filter(i=>i.area_id===view)),s=mesDe(items.filter(i=>i.area_id===view));
    $('#app').innerHTML=`<div class="top"><button class="btn" onclick="view=null;render()">← Personal</button><button class="btn p" onclick="openForm(${view})">+ Nueva</button></div><div class="hd"><h1>${a.icono} ${esc(a.nombre)}</h1><span class="sub">${l.length} pendientes · S/ ${s.por.toFixed(2)} por pagar este mes · ${s.ok} cumplidas</span></div><div class="tgrid">${l.map(row).join('')||'<div class="card empty">Nada pendiente aquí.</div>'}</div>`;return}
  const s=mesDe(items),srt=sort(pend),top=srt.slice(0,4),rest=srt.slice(4,12);
  const pm=pend.filter(i=>i.fecha.startsWith(ym)).length,pct=s.ok+pm?Math.round(100*s.ok/(s.ok+pm)):0;
  const pagos=pend.filter(i=>i.monto&&days(i.fecha)>=0).sort((x,y)=>x.fecha.localeCompare(y.fecha)).slice(0,4);
  $('#app').innerHTML=`<div class="top"><a class="btn back" href="./">← Volver al menú</a><span><button class="btn" onclick="planOpen()">📅 Plan de hoy</button> <button class="btn" onclick="planSemOpen()">🗓 Plan semanal</button> <button class="btn p" onclick="openForm()">+ Nueva</button></span></div>

/* ===== IA: captura en lenguaje natural + plan de hoy ===== */
const WD=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
async function ia(b){const r=await fetch(URL_+'/functions/v1/lifeos-ia',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function dmf(l){const now=new Date();let off=0,b=l.match(/\b(?:el\s+)?(?:d[ií]a\s+)?(\d{1,2})\s+(?:de\s+|del\s+)?(este\s+mes|mes\s+actual|(?:el\s+)?(?:pr[oó]ximo|siguiente)\s+mes|mes\s+que\s+viene)/);
  if(b){off=/pr[oó]ximo|siguiente|viene/.test(b[2])?1:0}
  else{b=l.match(/\bd[ií]a\s+(\d{1,2})\b(?!\s*de\s)/)||l.match(/\bel\s+(\d{1,2})\b(?!\s*(?:de\s|\/|:|am|pm|h\b|soles?))/);if(b&&+b[1]<now.getDate())off=1}
  if(!b)return null;const d=+b[1];if(d<1||d>31)return null;
  const base=new Date(now.getFullYear(),now.getMonth()+off,1),y=base.getFullYear(),m=base.getMonth();
  return iso(new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate())))}
function localParse(t){const now=new Date(),l=t.toLowerCase(),add=n=>iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+n));let f=iso(now);
  if(/pasado mañana/.test(l))f=add(2);else if(/mañana/.test(l))f=add(1);
  else if(dmf(l))f=dmf(l);
  else{const k=WD.findIndex(w=>l.includes(w)||l.includes(w.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));if(k>=0)f=add((k-now.getDay()+7)%7||7)}
  const m=l.match(/s\/\.?\s*(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s*soles?|(?:cuesta|cuestan|costo|costó|son|total)\s*(?:de\s*)?(\d+(?:[.,]\d+)?)/),monto=m?parseFloat((m[1]||m[2]||m[3]).replace(',','.')):null;
  const h=l.match(/(\d{1,2})(?::(\d\d))?\s*(am|pm)\b/),hora=h?pad((+h[1]%12)+(h[3]==='pm'?12:0))+':'+(h[2]||'00'):'';
  const cat=/pag|recibo|luz|agua|alquiler/.test(l)?'pago':/cita|doctor|dentista|médico/.test(l)?'cita':/trámite|dni|renov/.test(l)?'trámite':'otro';
  const titulo=t.replace(/\s*(el\s+)?(d[ií]a\s+)?\d{1,2}\s+(de\s+|del\s+)?(este\s+mes|mes\s+actual|(el\s+)?(pr[oó]ximo|siguiente)\s+mes|mes\s+que\s+viene)/gi,'').replace(/\s*(el )?d[ií]a\s+\d{1,2}\b/gi,'').replace(/\s*(cuesta|cuestan|costo|costó)\s*(de\s*)?(s\/\.?\s*)?\d+([.,]\d+)?(\s*soles?)?/gi,'').replace(/\s*(el |para )?(lunes|martes|miércoles|jueves|viernes|sábado|domingo|pasado mañana|mañana|hoy)/gi,'').replace(/s\/\.?\s*\d+([.,]\d+)?|\d+([.,]\d+)?\s*soles?/gi,'').replace(/\s+/g,' ').trim();
  return{dm:!!dmf(l),titulo:titulo||t,fecha:f,hora,monto,categoria:cat,importancia:monto||cat==='pago'?3:2,esfuerzo:2,repite:'no'}}
function guessArea(t,c){const l=(t+' '+(c||'')).toLowerCase(),by=re=>areas.find(a=>re.test(a.nombre.toLowerCase()));
  return(/pag|recibo|luz|agua|internet|alquiler|tarjeta|deuda|cuota|dinero/.test(l)&&by(/finanz/))||(/cita|doctor|dentista|médic|medic|pastilla|vacuna|salud/.test(l)&&by(/salud/))||(/trámite|tramite|dni|renov|document|sunat|municip/.test(l)&&by(/tr[aá]mite/))||(/casa|hogar|limpi|arregl|gas|mantenim/.test(l)&&by(/hogar/))||(/cumple|familia|amig|regalo|reuni|fiesta|salir|salida|paseo|cine|concierto|social|visita|viaje|discoteca|karaoke|boda/.test(l)&&by(/familia/))||null}
async function captureUna(){
  const t=$('#cap').value.trim();if(!t)return;
  const m=$('#cap-msg'),now=new Date();m.textContent='Entendiendo…';
  const fuente={},CAMPOS=['titulo','categoria','fecha','hora','importancia','esfuerzo','monto','repite'];
  console.group('%c[LifeOS] Captura: "'+t+'"','font-weight:bold;color:#10b981');
  const payload={modo:'captura',texto:t,hoy:iso(now),dia:WD[now.getDay()],areas:areas.map(a=>({id:a.id,nombre:a.nombre}))};
  console.log('1) Enviado a la API:',payload);
  let resp=null,r=null,iaOk=false;
  try{
    resp=await ia(payload);
    console.log('2) Respuesta CRUDA de la API:',resp);
    r=resp.resultado;iaOk=!!(r&&r.titulo);
  }catch(e){console.warn('2) La API falló:',e.message)}
  const modelo=resp&&resp.modelo?(resp.proveedor?resp.proveedor+' / ':'')+resp.modelo:null;
  if(resp&&resp.intentos)console.table(resp.intentos);
  if(iaOk){
    console.log('%c   🤖 Modelo que respondió: '+modelo,'font-weight:bold;color:#10b981');
    console.log('   💭 Razonamiento de la IA:',r.razonamiento||'(la IA no dio razonamiento)');
    if(resp.correcciones&&Object.keys(resp.correcciones).length)console.log('   🔧 Correcciones del servidor (solo huecos):',resp.correcciones);
  }
  const lp=localParse(t);
  if(iaOk){
    CAMPOS.forEach(k=>fuente[k]='API ('+modelo+')');
    if(resp.correcciones){['monto','fecha'].forEach(k=>{if(resp.correcciones[k])fuente[k]='servidor (regex) sobre API'})}
    // Respaldo en el navegador: SOLO si la API dejó el campo vacío/inválido
    if(!(+r.monto>0)&&lp.monto){r.monto=lp.monto;fuente.monto='código local (respaldo)';console.log('   🔧 monto vacío en la API → completado por código local:',lp.monto)}
    if(lp.dm&&(!/^\d{4}-\d\d-\d\d$/.test(r.fecha||'')||r.fecha===iso(now))){r.fecha=lp.fecha;fuente.fecha='código local (respaldo)';console.log('   🔧 fecha vacía/hoy en la API → código local:',lp.fecha)}
  }else{
    console.warn('3) La API no dio respuesta usable → TODO lo decide el código local (respaldo)');
    r=lp;CAMPOS.forEach(k=>fuente[k]='código local (respaldo)');
  }
  // ÁREA: prioridad 1 = API; solo si falla → código local
  let area_id,quien;
  if(iaOk&&areas.some(a=>a.id==r.area_id)){area_id=+r.area_id;quien='API ('+modelo+')'}
  else{
    if(iaOk)console.warn('   ⚠ La API no dio un area_id válido ('+r.area_id+') → entra el código local');
    const g=guessArea(t,r.categoria);
    if(g){area_id=g.id;quien='código local (guessArea, respaldo)'}
    else{area_id=(areas[0]||{}).id;quien='⚠ POR DEFECTO (primera área, nadie decidió)'}
  }
  fuente.area=quien;
  const an=(areas.find(a=>a.id==area_id)||{}).nombre;
  console.log('%c4) ÁREA FINAL: '+an+'  ← decidió: '+quien,'font-weight:bold;color:'+(quien.startsWith('API')?'#10b981':'#d97706'));
  console.log('%c5) RESPUESTA FINAL DE: '+(iaOk?modelo:'código local (la API falló)'),'font-weight:bold;background:#10b981;color:#fff;padding:2px 6px;border-radius:4px');
  console.table(fuente);
  console.groupEnd();
  m.textContent=iaOk?'Revisa los datos y guarda ✓':'Sin IA por ahora: lectura básica. Revisa los datos.';
  const ok=(v,a,d)=>a.includes(v)?v:d;
  openForm(null,{titulo:String(r.titulo).slice(0,120),area_id,categoria:ok(r.categoria,CATS,'otro'),fecha:/^\d{4}-\d\d-\d\d$/.test(r.fecha)?r.fecha:iso(now),hora:r.hora||'',importancia:ok(+r.importancia,[1,2,3],2),esfuerzo:ok(+r.esfuerzo,[1,2,3],2),monto:r.monto>0?r.monto:null,repite:ok(r.repite,['no','semanal','mensual','anual'],'no'),notas:r.notas||''})
}

/* ===== captura múltiple: una frase -> varias actividades (personal y/o estudio) ===== */
let multi=[];
const CE=[['tarea','📋 Tarea'],['examen','📝 Examen'],['exposicion','🎤 Exposición']];
const REG_EST=/tarea|examen|parcial|exposici|pr[aá]ctica|laboratorio|\blab\b|trabajo (?:de|del|grupal)|entrega/i;
function cursoLocal(t){const l=t.toLowerCase();return cursos.filter(c=>l.includes(String(c.name).toLowerCase())).sort((a,b)=>b.name.length-a.name.length)[0]||null}
function normItem(x,t){
  const now=new Date();
  const base={on:true,destino:x.destino==='estudio'?'estudio':'personal',titulo:String(x.titulo||'').slice(0,120),fecha:/^\d{4}-\d\d-\d\d$/.test(x.fecha||'')?x.fecha:iso(now),hora:x.hora||''};
  if(base.destino==='estudio'){
    const c=x.curso_id!=null&&cursos.find(k=>String(k.id)===String(x.curso_id))||cursoLocal(x.fragmento||t);
    return{...base,categoria:CE.some(e=>e[0]===x.categoria)?x.categoria:'tarea',cur:c?String(c.id):(x.curso_nuevo?'new':''),curso_nuevo:c?'':(x.curso_nuevo||'')};
  }
  const g=areas.some(a=>a.id==x.area_id)?{id:+x.area_id}:(guessArea(base.titulo,x.categoria)||areas[0]||{});
  return{...base,area_id:g.id,categoria:CATS.includes(x.categoria)?x.categoria:'otro',importancia:[1,2,3].includes(+x.importancia)?+x.importancia:2,esfuerzo:[1,2,3].includes(+x.esfuerzo)?+x.esfuerzo:2,monto:+x.monto>0?+x.monto:null,repite:['no','semanal','mensual','anual'].includes(x.repite)?x.repite:'no'};
}
async function capture(){
  const t=$('#cap').value.trim();if(!t)return;
  const m=$('#cap-msg'),now=new Date();m.textContent='Entendiendo…';
  let resp=null;
  try{
    const r=await fetch(URL_+'/functions/v1/lifeos-captura',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({texto:t,hoy:iso(now),dia:WD[now.getDay()],areas:areas.map(a=>({id:a.id,nombre:a.nombre})),cursos:cursos.map(c=>({id:c.id,name:c.name}))})});
    resp=await r.json();if(resp.error)throw new Error(resp.error);
    console.log('[LifeOS] captura múltiple:',resp);
  }catch(e){console.warn('[LifeOS] captura múltiple falló:',e.message);resp=null}
  const its=resp&&resp.resultado&&resp.resultado.items;
  if(!its||!its.length){
    // sin IA o sin resultados: respaldo local (una sola actividad); si suena a estudio y hay curso, lo manda a estudio
    const lp=localParse(t),c=cursoLocal(t);
    if(REG_EST.test(t)&&cursos.length){
      multi=[normItem({destino:'estudio',titulo:lp.titulo,fecha:lp.fecha,hora:lp.hora,categoria:/examen|parcial/i.test(t)?'examen':/exposici/i.test(t)?'exposicion':'tarea',curso_id:c?c.id:null,fragmento:t},t)];
      m.textContent='Sin IA por ahora: lectura básica. Revisa los datos.';multiRender();$('#dlg').showModal();return;
    }
    return captureUna();
  }
  multi=its.map(x=>normItem(x,t));
  if(multi.length===1&&multi[0].destino==='personal'){
    const x=multi[0];m.textContent='Revisa los datos y guarda ✓';
    openForm(null,{titulo:x.titulo,area_id:x.area_id,categoria:x.categoria,fecha:x.fecha,hora:x.hora,importancia:x.importancia,esfuerzo:x.esfuerzo,monto:x.monto,repite:x.repite,notas:''});return;
  }
  m.textContent='';multiRender();$('#dlg').showModal();
}

    }
    return `<div class="mrow ${x.on?'':'off'}"><div class="mh">${chk}${dest}</div><div class="mg">${comun}${esp}</div></div>`}).join('')}</div>
  <p id="f-err" style="color:var(--red);font-size:13px;margin:8px 0 0"></p>
  <button class="btn p" id="m-save" style="width:100%;margin-top:10px" onclick="multiSave()">Guardar ${nP+nE||''} ${nP+nE===1?'actividad':'actividades'}${nP&&nE?` (${nP} personal · ${nE} estudio)`:''}</button>`;
}
function mSet(i,k,v,re){multi[i][k]=v;if(k==='cur'&&v!=='new')multi[i].curso_nuevo=multi[i].curso_nuevo;if(re||k==='cur')multiRender()}
function mDest(i,d){const x=multi[i];x.destino=d;
  if(d==='estudio'){if(!CE.some(e=>e[0]===x.categoria))x.categoria=/examen|parcial/i.test(x.titulo)?'examen':/exposici/i.test(x.titulo)?'exposicion':'tarea';const c=cursoLocal(x.titulo);x.cur=c?String(c.id):'';x.curso_nuevo=x.curso_nuevo||''}
  else{if(!CATS.includes(x.categoria))x.categoria='otro';const g=guessArea(x.titulo,x.categoria)||areas[0]||{};x.area_id=x.area_id||g.id;x.importancia=x.importancia||2;x.esfuerzo=x.esfuerzo||2;x.monto=x.monto??null;x.repite=x.repite||'no'}
  multiRender()}
async function multiSave(){
  const err=$('#f-err'),btn=$('#m-save');err.textContent='';
  const on=multi.filter(x=>x.on);if(!on.length){err.textContent='No hay nada seleccionado.';return}
  for(const x of on){
    if(!x.titulo.trim()||!x.fecha){err.textContent='Falta título o fecha en «'+(x.titulo||'una actividad')+'».';return}
    if(x.destino==='estudio'&&!x.cur){err.textContent='Elige el curso de «'+x.titulo+'».';return}
  }
  btn.disabled=true;btn.textContent='Guardando…';
  const saved=new Set();let nP=0,nE=0,k=0;
  try{
    // personales en un solo envío
    const per=on.filter(x=>x.destino==='personal');
    if(per.length){
      const r=await api('personal_items',{method:'POST',body:JSON.stringify(per.map(x=>({username:user.username,area_id:x.area_id,titulo:x.titulo.trim(),categoria:x.categoria,fecha:x.fecha,hora:x.hora||null,importancia:x.importancia,esfuerzo:x.esfuerzo,monto:x.monto||null,repite:x.repite,notas:''})))});
      items.push(...r);per.forEach(x=>saved.add(x));nP=per.length;
    }
    // estudio: crea cursos nuevos una sola vez por nombre y luego las tareas
    const nuevos={};
    for(const x of on.filter(y=>y.destino==='estudio')){
      let cid=x.cur;
      if(cid==='new'){
        const nm=x.curso_nuevo.trim(),key=nm.toLowerCase();
        if(!nuevos[key]){
          const pal=[['#3b5bdb','#e8edff'],['#e67700','#fff3e0'],['#7048e8','#f3f0ff'],['#0c8599','#e3fafc'],['#2f9e44','#ebfbee']][cursos.length%5];
          const r=await api('courses',{method:'POST',body:JSON.stringify({username:user.username,name:nm,icon:'📚',color:pal[0],bg:pal[1],orden:cursos.length})});
          cursos.push({id:r[0].id,name:nm,icon:'📚'});nuevos[key]=r[0].id;
        }
        cid=nuevos[key];
      }
      let dt=null;if(x.hora){const[h,mi]=x.hora.split(':').map(Number);dt=pad(h%12||12)+':'+pad(mi)+':'+(h>=12?'PM':'AM')}
      await api('tasks',{method:'POST',body:JSON.stringify({id:Date.now()+(k++),username:user.username,course_id:cid,name:x.titulo.trim(),deadline:x.fecha,deadline_time:dt,description:'',entrega:'',desc_images:[],pdfs:{teoria:[],tarea:[],adjuntos:[]},categoria:x.categoria||'tarea'})});
      saved.add(x);nE++;
    }
    $('#dlg').close();$('#cap').value='';
    $('#cap-msg').textContent='Listo ✓ '+(nP?nP+' personal'+(nP>1?'es':''):'')+(nP&&nE?' · ':'')+(nE?nE+' de estudio':'');
    render();
  }catch(e){
    multi=multi.filter(x=>!saved.has(x));
    if(saved.size)render();
    if(multi.length){multiRender();$('#f-err').textContent='No se pudo guardar todo. Lo ya guardado se quitó de la lista; reintenta el resto.'}
    else{$('#dlg').close();alert('No se pudo guardar.')}
  }
}
function dictar(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,m=$('#cap-msg');if(!SR){m.textContent='Tu navegador no permite dictado. Escribe la frase.';return}
  const r=new SR();r.lang='es-PE';r.onresult=e=>{$('#cap').value=e.results[0][0].transcript;capture()};r.onerror=()=>{m.textContent='No pude escuchar. Intenta de nuevo.'};m.textContent='Escuchando…';r.start()}

const toMin=h=>{const[a,b]=String(h).split(':').map(Number);return a*60+b},fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
async function planData(){const u=encodeURIComponent(user.username);
  const[cs,ts,st]=await Promise.all([api('courses?username=eq.'+u+'&select=id,name'),api('tasks?username=eq.'+u+'&select=id,course_id,name,deadline,deadline_time,categoria'),api('user_task_status?username=eq.'+u+'&select=task_id,hecho,entregado')]);
  const cn={},sd={},o=[];cs.forEach(c=>cn[c.id]=c.name);st.forEach(x=>sd[x.task_id]=x);
  items.filter(i=>!i.hecho).forEach(i=>{const a=areas.find(x=>x.id===i.area_id)||{};o.push({ref:'p'+i.id,tipo:'personal',titulo:i.titulo,categoria:i.categoria,fecha:i.fecha,hora:i.hora?String(i.hora).slice(0,5):null,dias_restantes:days(i.fecha),importancia:i.importancia,esfuerzo:i.esfuerzo,monto:i.monto,area:a.nombre})});
  ts.forEach(t=>{const s=sd[t.id]||{};if((s.hecho&&s.entregado)||days(t.deadline)<0)return;const ex=t.categoria==='examen';o.push({ref:'t'+t.id,tipo:'estudio',titulo:t.name,categoria:t.categoria,fecha:t.deadline,hora:t.deadline_time||null,dias_restantes:days(t.deadline),importancia:ex?3:2,esfuerzo:ex?3:2,area:cn[t.course_id]||'Curso'})});
  return o}
function motivo(i){const d=i.dias_restantes;return(d<0?'Vencido hace '+(-d)+' d':d==0?'Vence hoy':d==1?'Vence mañana':'Vence en '+d+' días')+' · importancia '+['','baja','media','alta'][i.importancia]}
function planLocal(l,desde,hasta){const dur=i=>i.tipo==='estudio'?(i.categoria==='examen'?90:60):[0,15,30,60][i.esfuerzo],sc=i=>{const d=i.dias_restantes;return(d<=0?10:d<=2?8:d<=7?5:d<=30?3:1)*2+i.importancia*2+i.esfuerzo};
  let t=toMin(desde);const e=toMin(hasta),bl=[],no=[];for(const i of[...l].sort((a,b)=>sc(b)-sc(a))){const m=dur(i);if(t+m<=e){bl.push({ref:i.ref,inicio:fmt(t),fin:fmt(t+m),motivo:motivo(i)});t+=m+5}else no.push(i.ref)}
  return{bloques:bl,sin_tiempo:no,consejo:''}}
function planValido(p,l,desde,hasta){if(!p||!Array.isArray(p.bloques)||!p.bloques.length)return false;const refs=new Set(l.map(i=>i.ref)),re=/^\d{2}:\d{2}$/;let prev=toMin(desde);
  for(const b of[...p.bloques].sort((x,y)=>String(x.inicio).localeCompare(String(y.inicio)))){if(!refs.has(b.ref)||!re.test(b.inicio)||!re.test(b.fin))return false;const a=toMin(b.inicio),z=toMin(b.fin);if(a<prev||z<=a||z>toMin(hasta))return false;prev=z}return true}
function planOpen(){const n=new Date(),m=Math.ceil((n.getHours()*60+n.getMinutes())/30)*30,d=m>=22*60?'08:00':fmt(m);
  $('#dlg').innerHTML=`<div class="top"><b>📅 Plan de hoy</b><button class="x" onclick="$('#dlg').close()">✕</button></div><div class="two"><div><label>Libre desde</label><input id="pl-d" type="time" value="${d}"></div><div><label>Hasta</label><input id="pl-h" type="time" value="${m>=22*60?'13:00':'22:00'}"></div></div><button class="btn p" style="width:100%;margin-top:10px" onclick="planGo()">Generar plan</button><div id="pl-out" style="margin-top:12px"></div>`;$('#dlg').showModal()}
async function planGo(){const desde=$('#pl-d').value,hasta=$('#pl-h').value,out=$('#pl-out');if(!desde||!hasta||toMin(desde)>=toMin(hasta)){out.innerHTML='<div class="empty">Elige un rango válido.</div>';return}
  out.innerHTML='<div class="empty">Armando tu plan…</div>';let l;try{l=await planData()}catch(e){out.innerHTML='<div class="empty">No se pudieron leer tus pendientes.</div>';return}
  if(!l.length){out.innerHTML='<div class="empty">No tienes pendientes. ¡Día libre!</div>';return}
  let p=null,via='IA';try{p=(await ia({modo:'plan',hoy:iso(new Date()),desde,hasta,items:sort(l.map(i=>({...i,fecha:i.fecha,hecho:false}))).slice(0,30)})).resultado}catch(e){}
  if(!planValido(p,l,desde,hasta)){p=planLocal(l,desde,hasta);via='modo básico (sin IA)'}
  const by={};l.forEach(i=>by[i.ref]=i);
  out.innerHTML=p.bloques.sort((a,b)=>a.inicio.localeCompare(b.inicio)).map(b=>{const i=by[b.ref];return`<div class="card row"><div class="chip c2" style="min-width:96px"><span class="h" style="font-size:15px">${b.inicio}</span><span class="f">a ${b.fin}</span></div><div class="t"><b>${i.tipo==='estudio'?'📚':'🏡'} ${esc(i.titulo)}</b><small>${esc(b.motivo||motivo(i))}</small></div></div>`}).join('')
   +((p.sin_tiempo||[]).filter(r=>by[r]).length?`<h3>No cabe hoy</h3>`+p.sin_tiempo.filter(r=>by[r]).map(r=>`<div class="card row"><div class="t"><b>${esc(by[r].titulo)}</b><small>${motivo(by[r])}</small></div></div>`).join(''):'')
   +(p.consejo?`<div class="card" style="margin-top:8px">💡 ${esc(p.consejo)}</div>`:'')+`<div style="font-size:11px;color:var(--mut);margin-top:6px">Generado con ${via}</div>`}
/* ===== plan semanal: próximos 7 días, sin IA ===== */
function hm(h){if(!h)return 9999;const m=String(h).match(/(\d{1,2}):(\d\d)(?::\d\d)?\s*(AM|PM)?/i);if(!m)return 9999;let H=+m[1];if(m[3])H=H%12+(m[3].toUpperCase()==='PM'?12:0);return H*60+ +m[2]}
function hs(h){const v=hm(h);return v===9999?null:pad(Math.floor(v/60))+':'+pad(v%60)}
function semItem(i,mot){const h=hs(i.hora);return `<div class="card row"><div class="chip c2" style="min-width:84px">${h?`<span class="h" style="font-size:15px">${h}</span>`:`<span class="h s">Todo el día</span>`}</div><div class="t"><b>${i.tipo==='estudio'?'📚':'🏡'} ${esc(i.titulo)}</b><small>${esc(i.area||'')}${i.monto?' · S/ '+Number(i.monto).toFixed(2):''}${mot?'<br>💡 '+esc(mot):''}</small></div></div>`}
async function planSemOpen(){
const d=$('#dlg');d.innerHTML='<div class="top"><b>🗓 Plan semanal</b><button class="x" onclick="$(\'#dlg\').close()">✕</button></div><div id="sem-out" class="mlist"><div class="empty">Pensando tu semana… puede tardar unos segundos.</div></div>';d.showModal();
let l;try{l=await planData()}catch(e){$('#sem-out').innerHTML='<div class="empty">No se pudieron leer tus pendientes.</div>';return}
if(!l.length){$('#sem-out').innerHTML='<div class="empty">No tienes pendientes. ¡Semana libre!</div>';return}
const n=new Date(),hoy=iso(n),dias=[...Array(7)].map((_,i)=>iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()+i)));
const ord=(a,b)=>hm(a.hora)-hm(b.hora)||b.importancia-a.importancia;
let ai=null,via='';
try{const r=await fetch(URL_+'/functions/v1/lifeos-semana',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({hoy,dia:WD[n.getDay()],items:sort(l.map(i=>({...i,fecha:i.fecha,hecho:false}))).slice(0,40).map(i=>({ref:i.ref,titulo:i.titulo,tipo:i.tipo,categoria:i.categoria,fecha:i.fecha,hora:i.hora,vence_en_dias:i.dias_restantes,importancia:i.importancia,esfuerzo:i.esfuerzo,area:i.area}))})});
const j=await r.json();if(j.error)throw new Error(j.error);ai=j.resultado;via=(j.proveedor?j.proveedor+' / ':'')+(j.modelo||'')}catch(e){console.warn('[LifeOS] plan semanal IA falló:',e.message);ai=null}
const by={},asig={},mot={},enf={};l.forEach(i=>by[i.ref]=i);
if(ai&&Array.isArray(ai.dias))ai.dias.forEach(x=>{if(!dias.includes(x.fecha))return;enf[x.fecha]=String(x.enfoque||'').slice(0,80);(x.items||[]).forEach(y=>{const it=by[y.ref];if(it&&!asig[y.ref]&&!(it.fecha>=hoy&&it.fecha<x.fecha)){asig[y.ref]=x.fecha;mot[y.ref]=String(y.motivo||'').slice(0,140)}})});
const okAI=Object.keys(asig).length>0,desp=new Set(ai&&Array.isArray(ai.despues)?ai.despues:[]);
l.forEach(i=>{if(asig[i.ref])return;if(okAI&&desp.has(i.ref)&&i.dias_restantes>6)return;if(i.dias_restantes<=6){asig[i.ref]=i.dias_restantes<0?hoy:i.fecha}});
l.forEach(i=>{if(i.dias_restantes<0&&!mot[i.ref])mot[i.ref]='Está vencido: va primero.'});
let h='',max=0,maxd=0;
dias.forEach((f,i)=>{const L=l.filter(x=>asig[x.ref]===f).sort(ord);if(L.length>max){max=L.length;maxd=i}
h+=`<h3>${i===0?'Hoy':i===1?'Mañana':fdate(f)} · ${enf[f]?esc(enf[f]):(L.length?L.length+(L.length===1?' actividad':' actividades'):'libre')}</h3>`+(L.length?L.map(x=>semItem(x,mot[x.ref])).join(''):'<div class="card empty">Nada programado.</div>')});
const resto=l.filter(i=>!asig[i.ref]).length;
const cons=okAI&&ai.consejo?String(ai.consejo):(max>=3?`Tu día más cargado es ${maxd===0?'hoy':maxd===1?'mañana':fdate(dias[maxd])} (${max} actividades). Si puedes, adelanta algo.`:'');
if(cons)h+=`<div class="card" style="margin-top:8px">💡 ${esc(cons)}</div>`;
if(resto)h+=`<div style="font-size:12px;color:var(--mut);margin-top:8px">Además hay ${resto} pendiente${resto>1?'s':''} para después de esta semana.</div>`;
h+=`<div style="font-size:11px;color:var(--mut);margin-top:6px">${okAI?'Generado con '+esc(via):'Modo básico (la IA no respondió): ordenado por fecha, sin motivos.'}</div>`;
$('#sem-out').innerHTML=h}


(async()=>{if(!user||!user.username){render();return}$('#app').innerHTML='<div class="empty">Cargando…</div>';try{await load();render()}catch(e){$('#app').innerHTML='<div class="card empty">No se pudo conectar con la base de datos.</div>'}})();
</script>
